<!doctype html><meta charset="utf-8"><title>Resort format benchmark</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#43adab}canvas,video,img{position:absolute;width:100%;height:100%;object-fit:contain}output{position:absolute;bottom:10px;color:white}</style><canvas width="1280" height="720"></canvas><video muted loop playsinline></video><img src="assets/poster.png"><output></output><script type="module">
const format=new URLSearchParams(location.search).get('format')||'video',canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),video=document.querySelector('video'),still=document.querySelector('img'),out=document.querySelector('output');
let paused=false,raf=0,last=0,nextDraw=0,clock=0,frames=0,deltas=[],banks=[];
canvas.hidden=format!=='atlas';video.hidden=format!=='video';still.hidden=format!=='still';
if(format==='video'){video.src='assets/water-720.mp4';await video.play();}
if(format==='atlas'){
 banks=await Promise.all(Array.from({length:23},(_,n)=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=`assets/benchmark-atlas/bank-${n}.png`;})));
}
function tick(t){raf=0;if(paused)return;if(nextDraw&&t+.1<nextDraw){raf=requestAnimationFrame(tick);return;}if(!nextDraw||t-nextDraw>1000/30)nextDraw=t;nextDraw+=1000/30;if(last){clock+=(t-last)/1000;deltas.push(t-last);}last=t;frames++;
 if(format==='atlas'){const index=Math.floor(clock*30)%360,cell=index%16;ctx.drawImage(banks[Math.floor(index/16)],(cell%4)*1280,Math.floor(cell/4)*720,1280,720,0,0,1280,720);}
 const q=video.getVideoPlaybackQuality();out.dataset.metrics=JSON.stringify({format,clock,frames,totalVideoFrames:q.totalVideoFrames,droppedVideoFrames:q.droppedVideoFrames,meanFrameMs:deltas.reduce((a,b)=>a+b,0)/Math.max(1,deltas.length),p95FrameMs:deltas.length?[...deltas].sort((a,b)=>a-b)[Math.floor(deltas.length*.95)]:0,paused});
 if(frames%30===0)fetch('/bench-metrics',{method:'POST',headers:{'Content-Type':'application/json'},body:out.dataset.metrics});if(format!=='still')raf=requestAnimationFrame(tick);
}
window.livelyWallpaperPlaybackChanged=data=>{paused=JSON.parse(data).IsPaused;if(paused){cancelAnimationFrame(raf);video.pause();last=0;}else{if(format==='video')video.play();raf=requestAnimationFrame(tick);}};
if(format==='still'){tick(performance.now());setInterval(()=>fetch('/bench-metrics',{method:'POST',headers:{'Content-Type':'application/json'},body:out.dataset.metrics}),1000);}else raf=requestAnimationFrame(tick);
</script>

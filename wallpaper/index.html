<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resort Island</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#399f9f}#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}video,img,canvas{position:absolute;width:100%;height:100%;object-fit:contain;pointer-events:none}#stage{position:absolute;inset:0}#controls{position:absolute;bottom:20px;left:20px;background:#fcf4dfef;border-radius:16px;padding:12px;display:none;color:#403d31;font:14px system-ui}button,select{margin:4px;padding:6px}#controls.show{display:block}</style>
<div id="stage"><img id="poster" src="assets/poster.png"><video id="water" muted loop playsinline preload="auto" poster="assets/poster.png"></video><img id="land" src="assets/static.png"><canvas id="actors" width="1920" height="1080"></canvas></div>
<div id="controls" style="z-index:3"><label><input type="checkbox" id="waterToggle" checked>Вода</label><select id="quality"><option value="high">1080p / 30 fps</option><option value="low">720p / 30 fps</option><option value="off">Нерухомий кадр</option></select><select id="timeOfDay" aria-label="Час доби"><option value="auto">Годинник ПК</option><option value="morning">Ранок</option><option value="day">День</option><option value="evening">Вечір</option><option value="night">Ніч</option></select><select id="event"><option>starting</option><option>editing</option><option>testing</option><option>failed</option><option>permission</option><option>done</option><option>browsing</option><option>idle</option></select><button id="send">Перевірити реакцію</button><output id="status"></output></div>
<div id="life-controls" hidden style="position:absolute;z-index:3;bottom:90px;left:20px;background:#fcf4dfef;border-radius:16px;padding:12px;color:#403d31;font:14px system-ui"><label>Персонаж <select id="actor"><option value="claude">Pip · Claude</option><option value="codex">Codex</option><option value="apps">Програми</option></select></label><label>Місце <select id="activity"><option value="seat">Сидіти й пити чай</option><option value="bed">Лежати й чухати пузо</option><option value="tea">Заварити чай</option></select></label><button id="visit">Піти відпочити</button></div>
<script type="module" src="player.js"></script></html>

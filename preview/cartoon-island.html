<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D острів · живі шпалери</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#225e69;font:14px system-ui;color:#263f44}canvas{position:fixed;width:100%;height:100%;inset:0}aside{position:fixed;top:18px;left:18px;max-width:430px;background:#fff8e9ee;padding:18px;border-radius:20px;box-shadow:0 6px 30px #294d5122}h1{font-size:18px;margin:0 0 6px}p{margin:0 0 12px;line-height:1.5}nav{display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:9px 12px;background:#e4eee0;color:#354c3c;cursor:pointer}button[aria-pressed=true]{background:#edaf6e}label{display:block;margin-top:12px}aside.hidden{opacity:0;pointer-events:none}#controls{position:fixed;right:16px;top:16px;background:#fff8e9dd}
</style>
<canvas id="ocean" aria-hidden="true"></canvas>
<canvas id="scene" aria-label="Мультяшний острів: чоловічок реагує на дії програм"></canvas>
<aside><h1>Твій 3D острів 🌴</h1><p>Об’ємний рельєф і жива вода. Потягни сцену, щоб оглянути острів. Кнопки імітують дії програм.</p><nav></nav><label><input id="motion" type="checkbox" checked> Анімація</label></aside>
<button id="controls">Сховати керування</button>
<script type="module">
import {IslandWorld,CAMERA} from '../extensions/cartoon-island@avalon.local/world.js';
import {drawWorld} from '../extensions/cartoon-island@avalon.local/scene-3d.js';
import {createOcean} from './ocean-webgl.js';
const canvas=document.querySelector('#scene'),waterCanvas=document.querySelector('#ocean'),ctx=canvas.getContext('2d'),world=new IslandWorld(),camera={...CAMERA};
let ocean;try{ocean=await createOcean(waterCanvas,camera);window.oceanReady=true;}catch(error){console.error(error);document.querySelector('aside p').textContent='Вода без ефектів: '+error.message;window.oceanReady=false;}
window.islandWorld=world;window.islandCamera=camera;
const options=[['starting','Почав задачу'],['editing','Редагує'],['testing','Тести'],['failed','Тести впали'],['permission','Дозвіл'],['done','Завершив'],['browsing','Браузер'],['idle','Відпочинок']];
const params=new URLSearchParams(location.search);
if(params.has('state')){world.floors=3;world.present(params.get('state'),performance.now()/1000);Object.assign(world,world.target());world.path=[];}
if(params.has('clean')){document.querySelector('aside').classList.add('hidden');document.querySelector('#controls').style.display='none';}
const nav=document.querySelector('nav');
for(const [state,label] of options){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed','false');b.onclick=()=>{world.present(state,performance.now()/1000,['browsing','idle'].includes(state)?'desktop':'claude');for(const item of nav.children)item.setAttribute('aria-pressed',String(item===b));};nav.append(b);}
const control=document.querySelector('#controls');control.onclick=()=>{const hidden=document.querySelector('aside').classList.toggle('hidden');control.textContent=hidden?'Показати керування':'Сховати керування';};
document.querySelector('#motion').checked=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const dpr=Math.min(devicePixelRatio,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;waterCanvas.width=canvas.width;waterCanvas.height=canvas.height;}addEventListener('resize',resize);resize();
let pointer=null;canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointermove',e=>{if(!pointer)return;camera.yaw+=(e.clientX-pointer.x)*.006;camera.pitch=Math.max(.45,Math.min(1.05,camera.pitch+(e.clientY-pointer.y)*.004));pointer={x:e.clientX,y:e.clientY};});
let last=performance.now()/1000,lastDraw=0;
function frame(ms){const now=ms/1000;world.step(now,now-last,document.querySelector('#motion').checked);last=now;
if(ms-lastDraw>33){lastDraw=ms;ocean?.draw(world.t);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);const s=Math.min(canvas.width/1000,canvas.height/650);ctx.setTransform(s,0,0,s,(canvas.width-1000*s)/2,(canvas.height-650*s)/2);drawWorld(ctx,world,1000,650,camera);}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>
